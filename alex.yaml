# Example of configuration. 
# If you define it in pubspec.yaml,
# you should add it in section alex:

# Base URL for issue tracker (optional).
# If set, changelog entries will reference issues with a markdown link
# instead of a plain `(#N)` suffix. Trailing `/` is allowed.
# Example: https://site/project/issue
issue_url:

# Localization
l10n:
  output_dir: lib/application/l10n
  source_file: lib/application/localization.dart
  translation_files_pattern: intl_{locale}.arb
  base_locale_for_abr: ru
  base_locale_for_xml: en
  xml_output_dir: lib/application/l10n/xml
  xml_output_name: 
  require_latin: [ 'ca', 'cs', 'da', 'de', 'en', 'es', 'fi', 'fr', 'hr', 'hu', 'id', 'it', 'ms', 'nl', 'no', 'pl', 'pt', 'pt_BR', 'ro', 'sk', 'sl', 'sr', 'sv', 'tr' ]

# Code generation (alex code gen)
code:
  # Use the `--workspace` flag when generating code in a pub workspace.
  # Requires build_runner >= 2.11.0 (otherwise ignored).
  # When enabled, generation runs once from the workspace root with the
  # `--workspace` flag instead of per-package. Set to false to disable.
  use_workspace: true

  # Quality gates (alex code check)
  check:
    # Target of the build gate (used with the --build flag):
    # ios | apk | appbundle | web | macos.
    # If not defined - ios is used on macOS and apk on other platforms.
    build_target:
    # Additional patterns (regular expressions) of the output lines
    # that should be hidden as a noise.
    noise: []

# Application build settings (alex release start --local)
build:
  # Name for build artifact files.
  # If not defined - project name from pubspec.yaml will be used.
  # Result file name: <name>_v<major>.<minor>.<patch>_<build>.<aab|ipa>,
  # for example: sundry_v0.1.2_3.ipa
  name:

# Custom scripts
scripts:
  pre_release_scripts_paths: []

# CI settings
ci:
  enabled: true

# GIT settings
git:
  branches:
    master: master
    develop: develop
    test: pipe/test
    feature_prefix: feature/
  remote: origin