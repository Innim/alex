<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="data:,">
    <title>Alex: release notes form</title>
    <style>
        pre {
            background-color: #eee;
        }

        body label {
            user-select: none;
        }

        .item-bg:nth-child(even) {
            background-color: #eee;
        }

        .item {
            margin-left: 10px;
            margin-right: 10px;
            padding-bottom: 15px;
        }

        .item textarea {
            width: 100%;
            box-sizing: border-box;
        }
    </style>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            let textAreas = document.getElementsByTagName('textarea')
            for (const textArea of textAreas) {
                let onChange = function () {
                    enforceMaxChars(textArea);
                    updateMaxCharsDisplay(textArea);
                };
                textArea.oninput = onChange;
                textArea.onchange = onChange;
                updateMaxCharsDisplay(textArea);
            }

            updateState(true);
        });

        function getMaxChars(textArea) {
            return parseInt(textArea.getAttribute('data-maxlength'));
        }

        // The limit is not set as the `maxlength` attribute, because browsers
        // count a newline as CRLF (2 chars) when they enforce it, while stores
        // count it as a single char. With the native attribute a text with N
        // newlines would be cut N chars earlier than the store allows.
        function enforceMaxChars(textArea) {
            let maxChars = getMaxChars(textArea);
            let value = textArea.value;
            let excess = value.length - maxChars;
            if (isNaN(maxChars) || excess <= 0) return;

            // Drop the part of the just entered text that doesn't fit
            // (the same way as the browser does for `maxlength`)
            // and keep the caret right after the remaining part.
            let caret = Math.max(textArea.selectionStart - excess, 0);
            textArea.value = value.substring(0, caret) + value.substring(caret + excess);
            textArea.selectionStart = textArea.selectionEnd = caret;
        }

        function updateMaxCharsDisplay(textArea) {
            let span = document.getElementById('maxCharsDisplay_' + textArea.name);
            let length = textArea.value.length;
            let maxChars = getMaxChars(textArea);
            span.innerText = length.toString() + "/" + maxChars.toString();
            // A value can be longer than the limit only if it came that way
            // from the previous step, so it should be visible.
            span.style.color = length > maxChars ? "red" : "";
        }

        function updateState(isDefault) {
            let items = document.querySelectorAll('.item');
            for (const item of items) {
                console.log(item.dataset.type);

                if ((item.dataset.type === "default") === isDefault) {
                    item.style.display = "block";
                    disableChildren(item.children, false);
                } else {
                    item.style.display = "none";
                    disableChildren(item.children, true);
                }
            }
        }

        function checkboxChanged(cb) {
            updateState(!cb.checked);
        }

        function disableChildren(children, value) {
            for (const child of children) {
                child.disabled = value;
            }
        }
    </script>
</head>
<body>
<h3>Change log:</h3>
<pre>%change-log%</pre>
<h3>Enter release notes:</h3>
<div style="margin-bottom: 15px; background-color: #eee">
    <label><input type="checkbox" onclick="checkboxChanged(this);">App Store/Google Play</label>
</div>
<form method="get">
    %items%
    <input type="submit" name="submit">
</form>
</body>
</html>
